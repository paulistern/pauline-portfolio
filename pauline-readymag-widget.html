<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#ffffff; overflow:hidden; cursor:none; }
canvas { display:block; width:100vw; height:100vh; cursor:none; }
#loader {
  position:fixed; inset:0; background:#ffffff;
  display:flex; align-items:center; justify-content:center;
  font:400 10px 'Courier New',monospace; letter-spacing:0.3em;
  color:#bbb; z-index:99;
}
</style>

<canvas id="c"></canvas>
<div id="loader">· · ·</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const loader = document.getElementById('loader');

const BG      = '#ffffff';
const FG      = '#000000';
const NUMS    = '0123456789';
const GAP     = 4;       // optimized grid
const CHAR_PX = 3.5;    // tiny numbers, very tight
const REPEL_R = 120;
const REPEL_F = 8;
const SPRING  = 0.12;
const FRIC    = 0.72;

// Source image natural dimensions & logo bbox (% of image)
// Image is 1920×1080, logo bbox: x=647-1206, y=419-744
const IMG_W = 1920, IMG_H = 1080;
const LOGO_X1 = 647, LOGO_X2 = 1206;
const LOGO_Y1 = 419, LOGO_Y2 = 744;

let W, H, particles = [], sparkles = [];
let mouse = { x:-9999, y:-9999 };
let ready = false, animId;
let logoImg = null;

class Particle {
  constructor(ox, oy) {
    this.ox = ox; this.oy = oy;
    const a = Math.random()*Math.PI*2;
    const r = 150 + Math.random()*Math.max(W,H)*0.7;
    this.x  = W/2 + Math.cos(a)*r;
    this.y  = H/2 + Math.sin(a)*r;
    this.vx = 0; this.vy = 0;
    this.char  = NUMS[Math.floor(Math.random()*NUMS.length)];
    this.alpha = 0;
  }
  update() {
    this.vx += (this.ox - this.x) * SPRING;
    this.vy += (this.oy - this.y) * SPRING;
    const dx = this.x-mouse.x, dy = this.y-mouse.y;
    const d  = Math.sqrt(dx*dx+dy*dy);
    if (d < REPEL_R && d > 0) {
      const f = (1 - d/REPEL_R) * REPEL_F;
      this.vx += dx/d*f; this.vy += dy/d*f;
      if (Math.random() < 0.1)
        this.char = NUMS[Math.floor(Math.random()*NUMS.length)];
    }
    this.vx *= FRIC; this.vy *= FRIC;
    this.x  += this.vx; this.y  += this.vy;
    if (this.alpha < 1) this.alpha = Math.min(1, this.alpha+0.025);
  }
  draw() {
    const dx = this.x-this.ox, dy = this.y-this.oy;
    const d  = Math.sqrt(dx*dx+dy*dy);
    const a  = this.alpha * (d < 2 ? 1 : Math.max(0, 1 - d/150));
    if (a < 0.004) return;
    ctx.globalAlpha  = a;
    ctx.fillStyle    = FG;
    ctx.fillText(this.char, this.x, this.y);
  }
}

const SP_CHARS = ['✧','˖','°','.','✦','·','✩','˚','★','✫','✬','✭'];
class Sparkle {
  constructor(init) { this.vx=0; this.vy=0; this.reset(init); }
  reset(init) {
    const m = 50;
    const zone = Math.floor(Math.random()*4);
    if      (zone===0) { this.ox=m+Math.random()*(W-m*2); this.oy=m*0.3+Math.random()*(H*0.13); }
    else if (zone===1) { this.ox=m+Math.random()*(W-m*2); this.oy=H*0.87+Math.random()*(H*0.11); }
    else if (zone===2) { this.ox=m*0.2+Math.random()*(W*0.12); this.oy=m+Math.random()*(H-m*2); }
    else               { this.ox=W*0.88+Math.random()*(W*0.11); this.oy=m+Math.random()*(H-m*2); }
    this.x=this.ox; this.y=this.oy; this.vx=0; this.vy=0;
    this.char    = SP_CHARS[Math.floor(Math.random()*SP_CHARS.length)];
    this.size    = 5+Math.random()*5;
    this.life    = 0;
    this.maxLife = 120+Math.random()*200;
    this.delay   = init ? Math.random()*200 : 0;
    this.baseA   = 0.2+Math.random()*0.45;
    this.drift   = (Math.random()-0.5)*0.18;
  }
  update() {
    if (this.delay>0) { this.delay--; return; }
    this.life++;
    this.vx += (this.ox-this.x)*0.035; this.vy += (this.oy-this.y)*0.035;
    const dx=this.x-mouse.x, dy=this.y-mouse.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if (d<REPEL_R && d>0) {
      const f=(1-d/REPEL_R)*(REPEL_F*0.5);
      this.vx+=dx/d*f; this.vy+=dy/d*f;
      if (Math.random()<0.06)
        this.char=SP_CHARS[Math.floor(Math.random()*SP_CHARS.length)];
    }
    this.x+=this.drift*0.25; this.y-=0.05;
    this.vx*=0.85; this.vy*=0.85;
    this.x+=this.vx; this.y+=this.vy;
    if (this.life>this.maxLife) this.reset(false);
  }
  draw() {
    if (this.delay>0) return;
    const t=this.life/this.maxLife;
    let a = t<0.12 ? t/0.12 : t<0.78 ? 1 : 1-(t-0.78)/0.22;
    const dx=this.x-this.ox, dy=this.y-this.oy;
    const wA=Math.max(0.04,1-Math.sqrt(dx*dx+dy*dy)/170);
    ctx.globalAlpha = a*this.baseA*wA;
    ctx.font        = `${this.size}px "Courier New",monospace`;
    ctx.textAlign   = 'center'; ctx.textBaseline='middle';
    ctx.fillStyle   = FG;
    ctx.fillText(this.char, this.x, this.y);
  }
}

function buildFromImage(img) {
  // Scale: fit logo to 80% of viewport, preserving aspect ratio
  // Logo is ~29% of img width, ~30% of img height
  const logoNatW = LOGO_X2 - LOGO_X1;
  const logoNatH = LOGO_Y2 - LOGO_Y1;
  const logoAspect = logoNatW / logoNatH;

  // Target: 78% of viewport width, vertically centered
  const targetW = W * 0.78;
  const targetH = targetW / logoAspect;

  // Center on screen
  const destX = (W - targetW) / 2;
  const destY = (H - targetH) / 2;

  // High-res offscreen for sampling
  const scale = 3;
  const off   = document.createElement('canvas');
  off.width   = W * scale;
  off.height  = H * scale;
  const oc    = off.getContext('2d');

  oc.fillStyle = '#fff';
  oc.fillRect(0,0,off.width,off.height);

  // Crop just the logo region from the image, draw scaled to target area
  oc.drawImage(
    img,
    LOGO_X1, LOGO_Y1, logoNatW, logoNatH,   // source crop
    destX*scale, destY*scale, targetW*scale, targetH*scale // destination
  );

  const data = oc.getImageData(0,0,W*scale,H*scale).data;
  const pts  = [];
  const step = GAP * scale;

  for (let y=0; y<H*scale; y+=step) {
    for (let x=0; x<W*scale; x+=step) {
      const i = (y*W*scale+x)*4;
      // dark pixels = logo ink (threshold)
      if (data[i]<120 && data[i+1]<120 && data[i+2]<120 && data[i+3]>80) {
        pts.push({ x: x/scale, y: y/scale });
      }
    }
  }
  return pts.map(p => new Particle(p.x, p.y));
}

function init() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ready = false;
  cancelAnimationFrame(animId);
  sparkles = Array.from({length:70}, (_,i) => new Sparkle(true));
  if (logoImg) {
    particles = buildFromImage(logoImg);
    ready = true;
    loader.style.display = 'none';
  }
}

function loop() {
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);

  for (const s of sparkles) { s.update(); s.draw(); }

  if (ready) {
    ctx.font         = `400 ${CHAR_PX}px "Courier New",monospace`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle    = FG;
    for (const p of particles) { p.update(); p.draw(); }
  }

  // paw cursor
  if (mouse.x > -999 && pawImg.complete) {
    ctx.globalAlpha = 1;
    ctx.drawImage(pawImg, mouse.x - 18, mouse.y - 6, 52, 52);
  }
  ctx.globalAlpha = 1;

  animId = requestAnimationFrame(loop);
}

canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  mouse.x=(e.clientX-r.left)*(W/r.width);
  mouse.y=(e.clientY-r.top)*(H/r.height);
});
canvas.addEventListener('mouseleave', ()=>{ mouse.x=-9999; mouse.y=-9999; });
window.addEventListener('resize', init);
